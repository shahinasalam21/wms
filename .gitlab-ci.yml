# Default image for build and deploy stages (using Docker image for Docker commands)
image: docker:latest

# Services for Docker-in-Docker (dind)
services:
  - docker:dind  # Enables Docker-in-Docker for running Docker commands

# Environment variables
variables:
  DOCKER_HOST: tcp://docker:2375  # Docker Daemon URL for Docker-in-Docker
  DOCKER_TLS_CERTDIR: ""  # Disable Docker TLS for Docker-in-Docker
  NODE_ENV: test  # Set environment to test
  DATABASE_URL: "postgres://postgres:shahi@db:5432/wms_db"  # Postgres database URL

# Define the stages of the pipeline
stages:
  - test
  - build
  - deploy

# Before script to handle Docker login (only in build and deploy stages)
before_script:
  # Docker login will only run during the build and deploy stages
  - if [[ "$CI_JOB_STAGE" == "build" || "$CI_JOB_STAGE" == "deploy" ]]; then docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY; fi

# Backend Test Stage (use node:18 image to run npm commands)
test-backend:
  stage: test
  image: node:18  # Use Node.js image for backend tests
  script:
    - cd backend
    - npm install  # Install backend dependencies with npm
    - npm test -- --watchAll=false  # Run backend tests

# Frontend Test Stage (use node:18 image to run npm commands)
test-frontend:
  stage: test
  image: node:18  # Use Node.js image for frontend tests
  script:
    - cd frontend
    - npm install  # Install frontend dependencies with npm
    - npm test -- --watchAll=false  # Run frontend tests

# Build Backend Docker Image (using docker:latest)
build-backend:
  stage: build
  script:
    - echo "Building Backend Docker Image..."
    - docker build -t $CI_REGISTRY_IMAGE/my-backend:latest ./backend
    - docker push $CI_REGISTRY_IMAGE/my-backend:latest  # Push backend image to GitLab registry
  only:
    - main  # Trigger this stage only on the main branch

# Build Frontend Docker Image (using docker:latest)
build-frontend:
  stage: build
  script:
    - echo "Building Frontend Docker Image..."
    - docker build -t $CI_REGISTRY_IMAGE/my-frontend:latest ./frontend
    - docker push $CI_REGISTRY_IMAGE/my-frontend:latest  # Push frontend image to GitLab registry
  only:
    - main  # Trigger this stage only on the main branch

# Deploy Backend (using docker:latest)
deploy-backend:
  stage: deploy
  script:
    - echo "Deploying Backend..."
    - docker pull $CI_REGISTRY_IMAGE/my-backend:latest  # Pull the latest backend image
    - docker stop backend || true  # Stop the current backend container (if running)
    - docker rm backend || true  # Remove the current backend container (if exists)
    - docker run -d -p 5000:5000 --name backend --env DATABASE_URL=$DATABASE_URL $CI_REGISTRY_IMAGE/my-backend:latest  # Start backend container
  only:
    - main  # Trigger this stage only on the main branch

# Deploy Frontend (using docker:latest)
deploy-frontend:
  stage: deploy
  script:
    - echo "Deploying Frontend..."
    - docker pull $CI_REGISTRY_IMAGE/my-frontend:latest  # Pull the latest frontend image
    - docker stop frontend || true  # Stop the current frontend container (if running)
    - docker rm frontend || true  # Remove the current frontend container (if exists)
    - docker run -d -p 80:80 --name frontend $CI_REGISTRY_IMAGE/my-frontend:latest  # Start frontend container
  only:
    - main  # Trigger this stage only on the main branch
