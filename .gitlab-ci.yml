# ✅ Use Node.js image to support npm commands
image: node:18

stages:
  - test
  - build
  - deploy

services:
  - docker:dind

variables:
  DOCKER_HOST: tcp://docker:2375
  NODE_ENV: test
  DATABASE_URL: "postgres://postgres:shahi@db:5432/wms_db"  # Change 'localhost' to 'db' if using Docker

before_script:
  - apt-get update && apt-get install -y python3 python3-pip
  - pip3 install docker-compose

# 1️⃣ Backend Test Stage
test-backend:
  stage: test
  script:
    - cd backend
    - npm install
    - npm test -- --watchAll=false

# 2️⃣ Frontend Test Stage
test-frontend:
  stage: test
  script:
    - cd frontend
    - npm install
    - npm test -- --watchAll=false

# 3️⃣ Build Backend Docker Image
build-backend:
  stage: build
  script:
    - docker build -t my-backend:latest ./backend
    - docker tag my-backend:latest registry.gitlab.com/Shahinasalam21/workflow-management/my-backend:latest
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin registry.gitlab.com
    - docker push registry.gitlab.com/Shahinasalam21/workflow-management/my-backend:latest
  only:
    - main

# 4️⃣ Build Frontend Docker Image
build-frontend:
  stage: build
  script:
    - docker build -t my-frontend:latest ./frontend
    - docker tag my-frontend:latest registry.gitlab.com/Shahinasalam21/workflow-management/my-frontend:latest
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin registry.gitlab.com
    - docker push registry.gitlab.com/Shahinasalam21/workflow-management/my-frontend:latest
  only:
    - main

# 5️⃣ Deploy Backend
deploy-backend:
  stage: deploy
  script:
    - echo "Deploying backend..."
    - docker pull registry.gitlab.com/Shahinasalam21/workflow-management/my-backend:latest
    - docker stop backend || true
    - docker rm backend || true
    - docker run -d -p 5000:5000 --name backend --env DATABASE_URL=$DATABASE_URL registry.gitlab.com/Shahinasalam21/workflow-management/my-backend:latest
  only:
    - main

# 6️⃣ Deploy Frontend
deploy-frontend:
  stage: deploy
  script:
    - echo "Deploying frontend..."
    - docker pull registry.gitlab.com/Shahinasalam21/workflow-management/my-frontend:latest
    - docker stop frontend || true
    - docker rm frontend || true
    - docker run -d -p 80:80 --name frontend registry.gitlab.com/Shahinasalam21/workflow-management/my-frontend:latest
  only:
    - main
