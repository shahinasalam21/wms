image: node:18

stages:
  - test
  - build
  - deploy

services:
  - docker:dind

variables:
  DOCKER_HOST: tcp://docker:2375
  NODE_ENV: test
  DATABASE_URL: "postgres://postgres:shahi@db:5432/wms_db"

before_script:
  - apt-get update && apt-get install -y python3-dev libffi-dev build-essential libssl-dev docker-compose

# Backend Test Stage
test-backend:
  stage: test
  script:
    - cd backend
    - npm install
    - npm test -- --watchAll=false

# Frontend Test Stage
test-frontend:
  stage: test
  script:
    - cd frontend
    - npm install
    - npm test -- --watchAll=false

# Build Backend Docker Image
build-backend:
  stage: build
  script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    - docker build -t my-backend:latest ./backend
    - docker tag my-backend:latest $CI_REGISTRY_IMAGE/my-backend:latest
    - docker push $CI_REGISTRY_IMAGE/my-backend:latest
  only:
    - main

# Build Frontend Docker Image
build-frontend:
  stage: build
  script:
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    - docker build -t my-frontend:latest ./frontend
    - docker tag my-frontend:latest $CI_REGISTRY_IMAGE/my-frontend:latest
    - docker push $CI_REGISTRY_IMAGE/my-frontend:latest
  only:
    - main

# Deploy Backend
deploy-backend:
  stage: deploy
  script:
    - echo "Deploying backend..."
    - docker pull $CI_REGISTRY_IMAGE/my-backend:latest
    - docker stop backend || true
    - docker rm backend || true
    - docker run -d -p 5000:5000 --name backend --env DATABASE_URL=$DATABASE_URL $CI_REGISTRY_IMAGE/my-backend:latest
  only:
    - main

# Deploy Frontend
deploy-frontend:
  stage: deploy
  script:
    - echo "Deploying frontend..."
    - docker pull $CI_REGISTRY_IMAGE/my-frontend:latest
    - docker stop frontend || true
    - docker rm frontend || true
    - docker run -d -p 80:80 --name frontend $CI_REGISTRY_IMAGE/my-frontend:latest
  only:
    - main